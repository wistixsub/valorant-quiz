<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Map Label Picker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; height: 100vh; font-family: 'Yu Gothic', 'Meiryo', sans-serif; background: #0d1117; color: #e6edf3; overflow: hidden; }

  #map-area { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #0a0f1a; }
  #map-container { position: relative; display: inline-block; cursor: crosshair; }
  #map-img { display: block; max-height: 100vh; max-width: calc(100vw - 300px); user-select: none; }

  .marker {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
  }
  .marker span {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: rgba(0,0,0,0.75);
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .marker.active span { border-color: #ff4655; background: rgba(255,70,85,0.25); }

  #sidebar {
    width: 300px;
    background: #161b22;
    border-left: 1px solid #30363d;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #map-selector { display: flex; border-bottom: 1px solid #30363d; }
  .map-tab {
    flex: 1;
    padding: 8px 4px;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    color: #8b949e;
    background: #21262d;
    border: none;
    font-family: inherit;
    border-right: 1px solid #30363d;
  }
  .map-tab:last-child { border-right: none; }
  .map-tab:hover { color: #e6edf3; background: #2d333b; }
  .map-tab.active { color: #ff4655; background: #161b22; font-weight: 700; }

  #sidebar-header { padding: 10px 16px; background: #21262d; border-bottom: 1px solid #30363d; }
  #progress { font-size: 12px; color: #8b949e; margin-top: 2px; }
  #instructions { font-size: 11px; color: #6e7681; margin-top: 4px; line-height: 1.5; }

  #label-list { flex: 1; overflow-y: auto; padding: 8px; }
  .label-item {
    padding: 7px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    border: 1px solid transparent;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .label-item:hover { background: #21262d; }
  .label-item.active { border-color: #ff4655; background: rgba(255,70,85,0.1); }
  .label-item.placed { color: #3fb950; }
  .label-item.active.placed { border-color: #3fb950; background: rgba(63,185,80,0.1); }
  .label-item .check { font-size: 10px; width: 12px; flex-shrink: 0; }
  .label-item .coords { font-size: 10px; color: #6e7681; margin-left: auto; }
  .label-item.placed .coords { color: #3fb950; }

  #bottom-panel { padding: 12px 16px; border-top: 1px solid #30363d; display: flex; flex-direction: column; gap: 8px; }
  #copy-btn {
    padding: 8px;
    background: #238636;
    border: none;
    color: #fff;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  #copy-btn:hover { background: #2ea043; }
  #copy-btn.copied { background: #1f6feb; }
  #reset-btn {
    padding: 6px;
    background: transparent;
    border: 1px solid #30363d;
    color: #8b949e;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  #reset-btn:hover { border-color: #e63946; color: #e63946; }
  #output-box {
    font-size: 10px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 4px;
    padding: 8px;
    white-space: pre;
    overflow: auto;
    max-height: 120px;
    color: #8b949e;
    display: none;
  }
  #undo-btn {
    padding: 6px;
    background: transparent;
    border: 1px solid #30363d;
    color: #8b949e;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  #undo-btn:hover { border-color: #ffa657; color: #ffa657; }
</style>
</head>
<body>

<div id="map-area">
  <div id="map-container">
    <img id="map-img" draggable="false" />
  </div>
</div>

<div id="sidebar">
  <div id="map-selector">
    <button class="map-tab active" data-map="bind">Bind</button>
    <button class="map-tab" data-map="haven">Haven</button>
    <button class="map-tab" data-map="split">Split</button>
  </div>
  <div id="sidebar-header">
    <div id="map-title" style="font-size:14px;color:#ff4655;font-weight:700;"></div>
    <div id="progress"></div>
    <div id="instructions">① リストでラベルを選択<br>② マップをクリックして配置<br>③ クリック後に自動で次へ進む</div>
  </div>

  <div id="label-list"></div>

  <div id="bottom-panel">
    <button id="undo-btn">↩ 直前を取り消す</button>
    <button id="copy-btn">TypeScript配列をコピー</button>
    <button id="reset-btn">このマップをリセット</button>
    <pre id="output-box"></pre>
  </div>
</div>

<script>
const MAPS = {
  bind: {
    name: 'Bind',
    url: 'https://media.valorant-api.com/maps/2c9d57ec-4431-9c5e-2939-8f9ef6dd5cba/displayicon.png',
    rotation: 180,
    labels: [
      'ディフェンス側スポーン',
      'Bホール',
      'Bエルボー',
      'Bサイト',
      'Bガーデン',
      'Bウィンドウ',
      'Bテレポーター',
      'Bロング',
      'Bファウンテン',
      'Bショート',
      'Bリンク',
      'B出口',
      'アタック側スポーン',
      'アタック側ケイヴ',
      'Aショート',
      'A小部屋',
      'Aテレポーター',
      'Aランプ',
      'Aタワー',
      'Aサイト',
      'Aシャワー',
      'Aロビー',
      'Aリンク',
      'A出口',
      'CT',
    ],
  },
  haven: {
    name: 'Haven',
    url: 'https://media.valorant-api.com/maps/2bee0dc9-4ffe-519b-1cbd-7fbe763a6047/displayicon.png',
    rotation: -90,
    labels: [
      'ディフェンス側スポーン',
      'Cサイト',
      'C小部屋',
      'Cロング',
      'Cロビー',
      'Cリンク',
      'Cウィンドウ',
      'Cガレージ',
      'Bバック',
      'Bサイト',
      '中央ウィンドウ',
      'アタック側スポーン',
      'Aロビー',
      'Aガーデン',
      'A下水道',
      'Aリンク',
      'Aサイト',
      'Aロング',
    ],
  },
  split: {
    name: 'Split',
    url: 'https://media.valorant-api.com/maps/d960549e-485c-e861-8d71-aa9d1aed12a2/displayicon.png',
    rotation: -90,
    labels: [
      'アタック側スポーン',
      'Aロビー',
      '下水道',
      'Aメイン',
      'スロープ',
      'Aラフター',
      'Aサイト',
      'エルボー',
      'スクリーン',
      'Aタワー',
      'ベント',
      'ボトム',
      'トップ',
      'メールボックス',
      '階段',
      'ディフェンス側スポーン',
      'Bタワー',
      'Bラフター',
      'Bサイト',
      'CT',
      'Bロビー',
      'ガレージ',
    ],
  },
};

// placements per map
const allPlacements = { bind: {}, haven: {}, split: {} };
let currentMap = 'bind';
let activeIndex = 0;
let lastAction = null;

const img = document.getElementById('map-img');
const container = document.getElementById('map-container');

function switchMap(mapId) {
  currentMap = mapId;
  activeIndex = 0;
  lastAction = null;
  document.querySelectorAll('.map-tab').forEach(t => t.classList.toggle('active', t.dataset.map === mapId));
  const map = MAPS[mapId];
  img.src = map.url;
  img.style.transform = map.rotation ? `rotate(${map.rotation}deg)` : '';
  document.getElementById('map-title').textContent = map.name + ' マップ ラベル配置';
  document.getElementById('output-box').style.display = 'none';
  renderList();
  renderMarkers();
}

function placements() { return allPlacements[currentMap]; }
function labels() { return MAPS[currentMap].labels; }

function renderList() {
  const list = document.getElementById('label-list');
  const p = placements();
  const lbls = labels();
  list.innerHTML = '';

  lbls.forEach((label, i) => {
    const pos = p[label];
    const div = document.createElement('div');
    div.className = 'label-item' +
      (i === activeIndex ? ' active' : '') +
      (pos ? ' placed' : '');

    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = pos ? '✓' : '·';

    const name = document.createElement('span');
    name.textContent = label;

    div.appendChild(check);
    div.appendChild(name);

    if (pos) {
      const coords = document.createElement('span');
      coords.className = 'coords';
      coords.textContent = `${pos.x},${pos.y}`;
      div.appendChild(coords);
    }

    div.addEventListener('click', () => { activeIndex = i; renderList(); renderMarkers(); });
    list.appendChild(div);
  });

  const placed = Object.keys(p).length;
  document.getElementById('progress').textContent = `${placed} / ${lbls.length} 配置済み`;

  const activeEl = list.querySelector('.active');
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
}

function renderMarkers() {
  container.querySelectorAll('.marker').forEach(m => m.remove());
  const p = placements();
  const lbls = labels();
  const rotation = MAPS[currentMap].rotation || 0;
  Object.entries(p).forEach(([label, pos]) => {
    const m = document.createElement('div');
    m.className = 'marker' + (label === lbls[activeIndex] ? ' active' : '');
    let left, top;
    if (rotation === -90) {
      left = pos.y; top = 100 - pos.x;
    } else if (rotation === 180) {
      left = 100 - pos.x; top = 100 - pos.y;
    } else {
      left = pos.x; top = pos.y;
    }
    m.style.left = left + '%';
    m.style.top  = top + '%';
    m.innerHTML = `<span>${label}</span>`;
    container.appendChild(m);
  });
}

container.addEventListener('click', (e) => {
  if (e.target !== img) return;
  const lbls = labels();
  if (lbls.length === 0) return;
  const rect = img.getBoundingClientRect();
  let x = parseFloat(((e.clientX - rect.left) / rect.width * 100).toFixed(1));
  let y = parseFloat(((e.clientY - rect.top) / rect.height * 100).toFixed(1));

  // Convert visual click coords back to original image coords
  const rot = MAPS[currentMap].rotation || 0;
  if (rot === -90) {
    const origX = parseFloat((100 - y).toFixed(1));
    const origY = parseFloat(x.toFixed(1));
    x = origX; y = origY;
  } else if (rot === 180) {
    x = parseFloat((100 - x).toFixed(1));
    y = parseFloat((100 - y).toFixed(1));
  }

  const label = lbls[activeIndex];
  const p = placements();
  lastAction = { label, prev: p[label] || null };
  p[label] = { x, y };

  if (activeIndex < lbls.length - 1) activeIndex++;

  renderList();
  renderMarkers();
});

document.getElementById('undo-btn').addEventListener('click', () => {
  if (!lastAction) return;
  const p = placements();
  if (lastAction.prev) {
    p[lastAction.label] = lastAction.prev;
  } else {
    delete p[lastAction.label];
  }
  activeIndex = labels().indexOf(lastAction.label);
  lastAction = null;
  renderList();
  renderMarkers();
});

document.getElementById('copy-btn').addEventListener('click', () => {
  const p = placements();
  const lbls = labels();
  const lines = lbls
    .filter(l => p[l])
    .map(l => `      { x: ${p[l].x}, y: ${p[l].y}, label: '${l}' },`);
  const ts = `    areaLabels: [\n${lines.join('\n')}\n    ],`;

  navigator.clipboard.writeText(ts).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'コピーしました！';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'TypeScript配列をコピー'; btn.classList.remove('copied'); }, 2000);
  });

  const box = document.getElementById('output-box');
  box.style.display = 'block';
  box.textContent = ts;
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm(`${MAPS[currentMap].name} の全ラベルをリセットしますか？`)) return;
  const p = placements();
  Object.keys(p).forEach(k => delete p[k]);
  activeIndex = 0;
  lastAction = null;
  document.getElementById('output-box').style.display = 'none';
  renderList();
  renderMarkers();
});

document.querySelectorAll('.map-tab').forEach(tab => {
  tab.addEventListener('click', () => switchMap(tab.dataset.map));
});

img.addEventListener('load', () => { renderList(); renderMarkers(); });
switchMap('bind');
</script>
</body>
</html>
